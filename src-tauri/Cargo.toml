[package]
name = "agr-tactical-board"
version = "1.0.0"
description = "Tactical Board — application tactique rugby"
authors = []
edition = "2021"

[lib]
name = "agr_tactical_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
